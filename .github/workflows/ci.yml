name: CI

on:
  push:
    branches: [main, 'fix/**', 'feat/admin-panel-forensic-reorganization-20260810']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests import application settings but must never connect to production.
      # These are non-production values used only for CI configuration validation
      # and tests that mock database access.
      SECRET_KEY: r5-ci-test-only-not-production
      DATABASE_URL: sqlite+aiosqlite:///./r5-ci-test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q tests/test_r5_destructive_operations.py
