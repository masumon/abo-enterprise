name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q tests/test_steadfast_settings.py tests/test_steadfast_test_connection.py tests/test_steadfast_provider.py tests/test_courier_status.py tests/test_courier_route_guard.py
