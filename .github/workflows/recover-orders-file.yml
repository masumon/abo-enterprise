name: Recover orders page

on:
  push:
    branches:
      - fix/complete-media-social-courier-20260810

permissions:
  contents: write

jobs:
  recover:
    if: ${{ !startsWith(github.event.head_commit.message, '[restore-orders]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore orders page from parent commit
        run: |
          git checkout 4ebe00795eb0e29753c6bcb8e4dcde62f8c44371 -- frontend/src/app/sumon/orders/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/sumon/orders/page.tsx
          git commit -m "[restore-orders] restore orders page before accidental rewrite"
          git push origin HEAD:fix/complete-media-social-courier-20260810
